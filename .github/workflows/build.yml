
name: Build Windows launcher (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build launcher and installer
        run: python scripts/build.py

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: Hyspayre-Windows-Unsigned
          path: |
            dist/Hyspayre-Launcher.exe
            dist/Hyspayre-Setup.exe
          if-no-files-found: error
